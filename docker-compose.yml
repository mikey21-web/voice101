services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lead-automation-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-lead_automation}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lead-automation-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lead-automation-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-lead_automation}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET:?SIGNED_URL_SECRET must be set and must differ from JWT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3001}
      # Where Dograh's container can reach this backend for the post-call webhook. Must be the
      # docker bridge address, NOT PUBLIC_URL — localhost inside dograh's container is itself.
      DOGRAH_WEBHOOK_URL: ${DOGRAH_WEBHOOK_URL:-http://host.docker.internal:3001}
      N8N_BACKEND_JWT: ${N8N_BACKEND_JWT:-}
      AGENT_SERVICE_URL: http://agent-service:8000
      AGENT_INBOUND_KEY: ${AGENT_INBOUND_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      AGENT_SERVICE_JWT: ${AGENT_SERVICE_JWT:-}
      JWT_EXPIRATION: 24h
      REDIS_URL: redis://redis:6379
      BACKEND_PORT: 3001
      NODE_ENV: production
      STORAGE_PROVIDER: local
      STORAGE_PATH: /app/uploads
      NICHE_CONFIG_PATH: /app/niche.config.yaml
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-admin@localhost}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
      INTEGRATIONS_ENC_KEY: ${INTEGRATIONS_ENC_KEY:?INTEGRATIONS_ENC_KEY must be set}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      WEBHOOK_API_KEYS: ${WEBHOOK_API_KEYS:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-US}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-meta}
      OPENWA_URL: ${OPENWA_URL:-http://host.docker.internal:2785}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_SESSION_ID: ${OPENWA_SESSION_ID:-}
      OPENWA_WEBHOOK_SECRET: ${OPENWA_WEBHOOK_SECRET:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      PIPER_URL: http://piper-tts:8123
      DEEPGRAM_AUTH_TOKEN: ${DEEPGRAM_AUTH_TOKEN:-}
      AGENT_MODEL: ${AGENT_MODEL:-deepseek-v4-flash}
      WORKFLOW_MODEL: ${WORKFLOW_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      DOGRAH_URL: ${DOGRAH_URL:-http://host.docker.internal:8010}
      DOGRAH_API_KEY: ${DOGRAH_API_KEY:-}
      DOGRAH_WORKFLOW_UUID_EN: ${DOGRAH_WORKFLOW_UUID_EN:-}
      DOGRAH_WORKFLOW_ID_EN: ${DOGRAH_WORKFLOW_ID_EN:-}
      DOGRAH_WORKFLOW_UUID_TE: ${DOGRAH_WORKFLOW_UUID_TE:-}
      DOGRAH_WORKFLOW_ID_TE: ${DOGRAH_WORKFLOW_ID_TE:-}
      DOGRAH_TELEPHONY_CONFIG_ID: ${DOGRAH_TELEPHONY_CONFIG_ID:-1}
      WEBHOOK_API_KEY_DOGRAH: ${WEBHOOK_API_KEY_DOGRAH:-}
      COMPANY_NAME: ${COMPANY_NAME:-Diyaa}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      SMALLEST_API_KEY: ${SMALLEST_API_KEY:-}
    volumes:
      - uploads:/app/uploads
      - ./niche.config.yaml:/app/niche.config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard-v2
      dockerfile: Dockerfile
      args:
        # Build-time: Vite inlines this into the static bundle. Same-origin /api
        # is routed to the backend by the reverse proxy (Caddy).
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_NICHE_NAME: ${VITE_NICHE_NAME:-agency}
        VITE_PUBLIC_POSTHOG_KEY: phc_A23CgswLWc4FBpdBcw2bLaW3UafXZwzZudHogP3UQbjS
        VITE_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
    container_name: lead-automation-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  uploads:
